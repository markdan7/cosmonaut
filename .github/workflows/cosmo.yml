name: cosmonaut-macos
on: workflow_dispatch

jobs:
  run-cosmo:
    runs-on: macos-13   # Intel runner (обов'язково)
    steps:
      - uses: actions/checkout@v4
      - name: Run and print macOS fragment
        shell: bash
        run: |
          chmod +x ./cosmonaut.com
          ./cosmonaut.com | awk '/Like on macOS!/{getline; print; exit}'
