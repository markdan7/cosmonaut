name: cosmonaut-macos
on: workflow_dispatch

jobs:
  run-cosmo:
    runs-on: macos-13        # обов'язково Intel runner
    steps:
      - uses: actions/checkout@v4

      - name: Prep
        shell: bash
        run: |
          set -x
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          file ./cosmonaut.com || true
          chmod +x ./cosmonaut.com

      - name: Assimilate APE loader (ok if it "fails")
        shell: bash
        run: |
          set -x
          ./cosmonaut.com --assimilate || true
          ls -la "$HOME" | sed -n '1,200p' || true
          ls -la "$HOME"/.ape* 2>/dev/null || true

      - name: Run binary (via loader if present) and save output
        shell: bash
        run: |
          set -euo pipefail
          LOADER=$(compgen -G "$HOME/.ape-* " | head -n1 || true)
          if [[ -n "${LOADER:-}" && -x "$LOADER" ]]; then
            "$LOADER" ./cosmonaut.com | tee out.txt
          else
            ./cosmonaut.com | tee out.txt
          fi

      - name: Print macOS fragment
        shell: bash
        run: |
          echo "---- macOS FRAGMENT ----"
          awk '/Like on macOS!/{getline; print; found=1; exit} END{if(!found) exit 1}' out.txt || true
          echo "---- Context (for debug) ----"
          grep -nA1 'Like on macOS!' out.txt || true
          echo "---- Full (tail) ----"
          tail -n +1 out.txt | sed -n '1,120p' || true
