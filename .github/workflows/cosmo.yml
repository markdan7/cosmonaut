name: cosmonaut-macos
on: workflow_dispatch
jobs:
  run-cosmo:
    runs-on: macos-13   # ⬅️ ВАЖЛИВО: Intel runner
    steps:
      - uses: actions/checkout@v4
      - name: Run and print macOS fragment
        shell: bash
        run: |
          chmod +x ./cosmonaut.com
          ./cosmonaut.com | sed -n '/Like on macOS!/{n;p;q}'
