name: cosmonaut-macos
on: workflow_dispatch

jobs:
  run-cosmo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prep
        shell: bash
        run: |
          set -x
          ls -la
          chmod +x ./cosmonaut.com
          xcode-select -p || true
          clang --version || true

      - name: Assimilate APE loader (ok if it "fails")
        shell: bash
        run: |
          set -x
          ./cosmonaut.com --assimilate || true
          ls -la ~ | sed -n '1,200p' || true
          ls -la ~/.ape* 2>/dev/null || true

      - name: Run and capture output (prints macOS fragment)
        shell: bash
        run: |
          set -o pipefail
          LOADER=$(compgen -G "$HOME/.ape-* " | head -n1 || true)
          if [[ -x "$LOADER" ]]; then
            "$LOADER" ./cosmonaut.com | tee out.txt || true
          else
            ./cosmonaut.com | tee out.txt || true
          fi
          echo "---- macOS FRAGMENT ----"
          awk '/Like on macOS!/{getline; print; exit}' out.txt || true

      - name: Grep fallback
        shell: bash
        run: |
          echo "---- Fallback (context) ----"
          grep -nA1 'Like on macOS!' out.txt || true
