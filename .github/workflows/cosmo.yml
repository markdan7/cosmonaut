name: cosmonaut-macos

on:
  workflow_dispatch:

jobs:
  run-cosmo:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prep
        shell: bash
        run: |
          chmod +x ./cosmonaut.com

      - name: Run on macOS (to be sure)
        shell: bash
        run: |
          set -euo pipefail
          ./cosmonaut.com --assimilate || true
          ./cosmonaut.com | tee out.txt
          echo "---- macOS FRAGMENT ----"
          awk '/Like on macOS!/{getline; print; found=1; exit} END{if(!found) exit 1}' out.txt || true

      - name: Dump __cstring and grep around macOS marker
        shell: bash
        run: |
          # Всі C-рядки з Mach-O
          otool -v -s __TEXT __cstring ./cosmonaut.com > cstrings.txt
          # 40 рядків після маркера
          awk '/Like on macOS!/{flag=1; c=0; next} flag && c++<40 {print}' cstrings.txt | sed -n '1,120p'
          echo '---- NEAR FLAG GUESS ----'
          # Контекст біля вже відомих шматків
          grep -n -E '4_7ru3_|c05m0p0l174n_c0nn353ur_' cstrings.txt | \
            while IFS=: read -r L _; do sed -n "$((L-5)),$((L+10))p" cstrings.txt; echo '---'; done || true
          echo '---- RAW STRINGS SEARCH ----'
          strings -a ./cosmonaut.com | grep -n -E 'bctf\{|4_7ru3_|c05m0p0l174n_c0nn353ur_|everywhere|once|programs|portable|portab|p0rt4b1' | head -n 80 || true
