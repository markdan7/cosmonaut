name: cosmonaut-macos
on: workflow_dispatch
jobs:
  run-cosmo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prep
        shell: bash
        run: |
          set -x
          uname -a
          ls -la
          chmod +x ./cosmonaut.com
          # переконуємось, що є компілятор для асиміляції
          xcode-select -p || true
          which clang || true
          clang --version || true

      - name: Assimilate APE loader (ok if it "fails")
        shell: bash
        run: |
          set -x
          # Спроба зібрати/розпакувати лоадер
          ./cosmonaut.com --assimilate || true
